name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # С настоящими uiautomator2 и Appium: тесты сверяют вызовы адаптеров с их API.
      - run: pip install -r requirements-dev.txt -r requirements-android.txt -r requirements-ios.txt
      - run: python -m pytest -q
